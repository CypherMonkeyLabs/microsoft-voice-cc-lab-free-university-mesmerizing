<svg id="flow" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 709.8125px;" viewBox="0 0 709.8125 70" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#flow{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#flow .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#flow .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#flow .error-icon{fill:#552222;}#flow .error-text{fill:#552222;stroke:#552222;}#flow .edge-thickness-normal{stroke-width:1px;}#flow .edge-thickness-thick{stroke-width:3.5px;}#flow .edge-pattern-solid{stroke-dasharray:0;}#flow .edge-thickness-invisible{stroke-width:0;fill:none;}#flow .edge-pattern-dashed{stroke-dasharray:3;}#flow .edge-pattern-dotted{stroke-dasharray:2;}#flow .marker{fill:#333333;stroke:#333333;}#flow .marker.cross{stroke:#333333;}#flow svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#flow p{margin:0;}#flow .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#flow .cluster-label text{fill:#333;}#flow .cluster-label span{color:#333;}#flow .cluster-label span p{background-color:transparent;}#flow .label text,#flow span{fill:#333;color:#333;}#flow .node rect,#flow .node circle,#flow .node ellipse,#flow .node polygon,#flow .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#flow .rough-node .label text,#flow .node .label text,#flow .image-shape .label,#flow .icon-shape .label{text-anchor:middle;}#flow .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#flow .rough-node .label,#flow .node .label,#flow .image-shape .label,#flow .icon-shape .label{text-align:center;}#flow .node.clickable{cursor:pointer;}#flow .root .anchor path{fill:#333333!i